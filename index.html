   <style>
  .calculator {
            position: fixed;
            left: 30px;
            top: 250px;
            background: #4CAF50;

        }

        .calculator:hover {
    box-shadow: 0 0 25px #4CAF50,
                0 0 50px #4CAF50;
    transition: 0.3s;
}


   body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;

        }


        h1 {
            color: #333;

        }


        .welcome-message {
            color: #666;

            margin-bottom: 30px;
        }

            font-size: 1.6em;
            margin-top: 20px;

            width:fit-content;
            margin:auto

        }
        .animation-message:hover {
            color: #00ff00;
            text-decoration: underline;
        }

        .button1 {

            font-size: 1em;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 0 15px #4CAF50;
        }

     @keyframes bounce {
        0% { transform: translateY(0); }
        15% { transform: translateY(-2px); }
        25% { transform: translateY(-5px); }
        50% { transform: translateY(-10px); }   
        100% { transform: translateY(-20px); }
        150% { transform: translateY(-10px); }
        175% { transform: translateY(-5px); }
        190% { transform: translateY(-2px); }
        210% { transform: translateY(0); }
     }
     
     .button1:hover{
        animation: bounce 0.5s infinite;
     }

     .button1:hover {
    box-shadow: 0 0 40px #4CAF50;
    transition: 0.3s;


}

.cube-calculator {

</style>
